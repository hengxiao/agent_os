skills:
- name: common.task.make_handoff
  version: 1.0.0
  kind: code
  description: '交接包构造:任务描述 + 已确认事实/约束 + 产物路径。Use when 非共享上下文下要把 工作交接给下一个 agent/会话,如
    task=''继续写报告'' + facts=[''预算上限 $2''] + artifacts=[''out/draft.md''] → {package:
    {...}};Do not use when 想把完整轨迹/对话 记录塞给对方——schema 层面拒绝(artifacts 只收字符串路径,消息对象直接报错),
    请把轨迹落盘后传路径。返回 {"package": {schema, task, facts, constraints, artifacts}}。'
  inputs:
    type: object
    properties:
      task:
        type: string
        description: 交接任务描述
      facts:
        type: array
        items:
          type: string
        description: 已确认事实清单
      constraints:
        type: array
        items:
          type: string
        description: 约束清单
      artifacts:
        type: array
        items:
          type: string
          description: 产物路径引用
        description: 产物路径清单(只收路径,拒绝轨迹对象)
    required:
    - task
  outputs:
    type: object
    properties:
      package:
        type: object
        description: 交接包 {schema, task, facts, constraints, artifacts}
  permissions: {}
  handler: transform:make_handoff
- name: common.task.set_timer
  version: 1.0.0
  kind: code
  description: '安排一次性/周期计时器(经 system.timer.set 内核原语):到点把 "[timer 到点]
    {note}" 注入调用帧上下文,立即返回 timer_id,计时在后台不占当前步骤。Use when
    需要定时复查/周期轮询兜底,如 {"interval_seconds": 300, "count": 3, "note": "检查构建
    状态"} → {"timer_id": "..."} 后继续干别的,到点自会收到提醒;Do not use when 能就地
    等到结果(直接等工具返回更便宜)——计时器只在"现在没结果、稍后要看"时有意义。
    one-shot 传 delay_seconds,周期传 interval_seconds(count 缺省无限,run 收尾自动取消),
    两者二选一,下限钳制 0.5s。返回 {"timer_id": str}。'
  inputs:
    type: object
    properties:
      delay_seconds:
        type: number
        description: one-shot 延迟秒数(与 interval_seconds 二选一;下限钳制 0.5)
      interval_seconds:
        type: number
        description: 周期间隔秒数(与 delay_seconds 二选一;下限钳制 0.5)
      count:
        type: integer
        description: 周期触发次数上限(仅 recurring 有意义;缺省 = 无限,run 收尾自动取消)
      note:
        type: string
        description: 到点提醒文本(注入消息的正文,写清"到点要看什么")
  outputs:
    type: object
    properties:
      timer_id:
        type: string
        description: 计时器 id(本 run 内有效;规格随帧 checkpoint 持久化——pause/进程重启后 resume 按剩余时间折算重武装,过期欠的一次恢复时立即补投;跨重启自动到点补投由宿主调度器 [schedule] 段负责)
    required:
    - timer_id
  permissions:
    tools:
    - system.timer.set
  handler: task_handlers:set_timer
- name: common.task.monitor_shell
  version: 1.0.0
  kind: code
  description: '后台 shell 输出监控(经 system.monitor.set 内核原语):起子进程逐行读输出,
    正则命中即把 "[monitor 命中] {line}" 注入调用帧上下文,立即返回 monitor_id。Use when
    要等长任务输出里的关键信号(构建报错/服务就绪行),如 {"command": "tail -f build.log",
    "pattern": "ERROR|Ready"} → {"monitor_id": "..."} 后继续干别的,命中自会收到消息;
    Do not use when 命令很快结束且要直接看全部输出(用 system.shell.exec 更直接)或只需
    定时复查(用 common.task.set_timer)。进程退出注入退出事件(带 exit_code);max_fires
    到顶(缺省 20)自动终止进程组。返回 {"monitor_id": str}。'
  inputs:
    type: object
    properties:
      command:
        type: string
        description: 被监控的 shell 命令(在帧工作目录内运行,stdout/stderr 合并逐行读)
      pattern:
        type: string
        description: 命中正则(缺省空串 = 每行都命中,慎用——输出即消息)
      note:
        type: string
        description: 备注文本(随规格落档,观测/对账用)
      max_fires:
        type: integer
        description: 命中次数上限(到顶注入封顶事件并终止进程组;缺省 20)
    required:
    - command
  outputs:
    type: object
    properties:
      monitor_id:
        type: string
        description: 监控 id(本 run 内有效;规格随帧 checkpoint 持久化——resume 重跑命令重武装,输出重放可能重复命中)
    required:
    - monitor_id
  permissions:
    tools:
    - system.monitor.set
  handler: task_handlers:monitor_shell
- name: common.task.connect_channel
  version: 1.0.0
  kind: code
  description: '外部事件源接入(经 system.channel.connect 内核原语):轮询跟踪事件文件新增行
    (类 tail -F),正则命中即把 "[channel 命中] {line}" 注入调用帧上下文,立即返回 channel_id。
    Use when 外部进程/系统把事件追加写进日志文件(构建状态/回调通知),需要事件触达而非
    定时盲查,如 {"path": "events.log", "pattern": "done|failed"} → {"channel_id": "..."};
    Do not use when 事件源不是文件(HTTP 回调走宿主事件通道)或要一次性读现有内容(用
    system.file.read)。rotation(截断重写)自动从文件头续读;max_fires 到顶(缺省 20)
    停止。返回 {"channel_id": str}。'
  inputs:
    type: object
    properties:
      path:
        type: string
        description: 事件文件路径(帧工作目录/read_paths 内;可不存在——出现后才开始出事件)
      pattern:
        type: string
        description: 命中正则(缺省空串 = 每个新增行都命中)
      note:
        type: string
        description: 备注文本(随规格落档,观测/对账用)
      interval:
        type: number
        description: 轮询间隔秒数(下限钳制 0.5;缺省 1.0)
      max_fires:
        type: integer
        description: 命中次数上限(到顶注入封顶事件并停止;缺省 20)
    required:
    - path
  outputs:
    type: object
    properties:
      channel_id:
        type: string
        description: 通道 id(本 run 内有效;规格含已读 offset 随帧 checkpoint 持久化——resume 从 offset 续读,不重放)
    required:
    - channel_id
  permissions:
    tools:
    - system.channel.connect
  handler: task_handlers:connect_channel
