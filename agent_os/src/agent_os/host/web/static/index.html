<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent OS</title>
<link rel="icon" href="data:,"><!-- 抑制 favicon.ico 404(无站点图标,浏览器默认即可) -->
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/app.css">
<link rel="stylesheet" href="/static/css/widgets.css">
<link rel="stylesheet" href="/static/css/themes/classic.css">
<link rel="stylesheet" href="/static/css/themes/moe.css">
<link rel="stylesheet" href="/static/css/themes/terminal.css">
<link rel="stylesheet" href="/static/css/themes/blueprint.css">
<link rel="stylesheet" href="/static/css/themes/ink.css">
<link rel="stylesheet" href="/static/css/themes/pixel.css">
</head>
<body data-route="runs">
<!-- 跳过导航(docs/WEB-A11Y.md §4 P1-6;WCAG 2.4.1)——必须是 body 的第一个可聚焦元素 -->
<a class="skip-link" href="#main">跳到主内容</a>
<header class="app-topbar">
  <div class="brand"><span class="brand-mark" aria-hidden="true">▎</span>Agent OS</div>
  <nav class="topnav" aria-label="主导航">
    <a class="nav-item" href="#/runs" data-nav="runs" aria-current="page">Runs</a>
    <a class="nav-item" href="#/skills" data-nav="skills">Skills</a>
    <a class="nav-item" href="#/tools" data-nav="tools">Tools</a>
    <a class="nav-item" href="#/lab" data-nav="lab">Lab</a>
    <a class="nav-item" href="#/debug" data-nav="debug">Debug</a>
  </nav>
  <div class="topbar-side">
    <div id="themePicker"></div>
    <button class="icon-btn sup-btn" id="inboxBtn" data-tip="Supervisor 收件箱"
            aria-label="Supervisor 收件箱">
      <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor"
           stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2.5 9.6l1.6-4.8A1 1 0 0 1 5 4.2h6a1 1 0 0 1 .9.6l1.6 4.8"/>
        <path d="M2.5 9.6V12A1.5 1.5 0 0 0 4 13.5h8a1.5 1.5 0 0 0 1.5-1.5V9.6"/>
        <path d="M2.5 9.6h3.2l.9 1.6h2.8l.9-1.6h3.2"/>
      </svg>
      <span class="sup-badge" id="inboxBadge" hidden>0</span>
    </button>
    <button class="live-indicator" id="liveIndicator" data-state="connecting"
            title="连接中…" aria-label="API 连接状态,点击立即重试"></button>
    <button class="btn btn-primary" id="newRunBtn" data-tip="发起新运行">+ New Run</button>
  </div>
</header>
<div class="app-shell">
  <aside class="sidebar" id="sidebar" aria-label="Run 列表">
    <div class="sidebar-head">
      <span class="sidebar-title">Runs</span>
      <button class="icon-btn collapse-btn" id="collapseBtn" title="折叠侧栏" aria-label="折叠侧栏">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor"
             stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M10 3 L5 8 L10 13"/>
        </svg>
      </button>
    </div>
    <div class="sidebar-tools">
      <select class="search-input set-select" id="setSelect" aria-label="按 skill set 过滤"
              title="按 skill set 过滤 run 列表" hidden></select>
      <input class="search-input" id="searchInput" type="search"
             placeholder="按技能名搜索…" aria-label="按技能名搜索">
      <div class="chips" id="statusChips" role="group" aria-label="状态筛选">
        <button class="chip is-active" data-status="all">全部</button>
        <button class="chip" data-status="failed">失败</button>
        <button class="chip" data-status="aborted">中止</button>
        <button class="chip" data-status="running">进行中</button>
      </div>
    </div>
    <div class="run-list" id="runList" role="listbox" aria-label="Run 列表"></div>
  </aside>
  <!-- tabindex="-1":skip-link 的落点必须可编程聚焦,否则焦点不会真的进来
       (只滚动、不移焦是 skip link 最常见的失效方式);-1 不进 Tab 序列 -->
  <main class="app-main" id="main" tabindex="-1"></main>
</div>
<div class="toast-stack" id="toastStack" aria-live="polite"></div>
<script type="module" src="/static/js/app.js"></script>
</body>
</html>
