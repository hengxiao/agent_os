<!DOCTYPE html>
<html lang="zh" data-theme="classic">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent OS · Desktop(desktop 根,C4.4)</title>
<link rel="stylesheet" href="/static/css/tokens.css?v=2026-08-12.4">
<link rel="stylesheet" href="/static/css/app.css?v=2026-08-12.4">
<link rel="stylesheet" href="/static/css/widgets.css?v=2026-08-12.4">
<link rel="stylesheet" href="/static/css/themes/classic.css?v=2026-08-12.4">
<link rel="stylesheet" href="/static/css/themes/moe.css?v=2026-08-12.4">
<link rel="stylesheet" href="/static/css/themes/terminal.css?v=2026-08-12.4">
<link rel="stylesheet" href="/static/css/themes/blueprint.css?v=2026-08-12.4">
<link rel="stylesheet" href="/static/css/themes/ink.css?v=2026-08-12.4">
<link rel="stylesheet" href="/static/css/themes/pixel.css?v=2026-08-12.4">
<link rel="stylesheet" href="./static/platform.css?v=2026-08-12.4">
<style>
  /* desktop chrome(全 token,platform 视觉同族;C4.4 产品化时归位 shared css)
     滚动层级(2026-08-12 重构):body 锁视口(100vh 不滚)→ .dt-root 吃余高
     (flex:1 min-height:0)→ 窗口内容区藏溢出,各面板自带滚动条 */
  body {
    background: var(--bg-0); color: var(--fg-0); font-size: var(--text-xs); margin: 0;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  .dt-top {
    flex: none;
    display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap;
    padding: var(--s2) var(--s3); border-bottom: var(--stroke) solid var(--line);
    background: var(--bg-1);
  }
  .dt-build { margin-left: auto; color: var(--fg-2); font-size: var(--text-2xs); font-family: var(--font-mono); }
  /* 「+ 新建」发起面菜单(收拢会话/app 两路;不留裸 select) */
  .dt-new { position: relative; }
  .dt-new-menu {
    position: absolute; top: calc(100% + var(--s1)); left: 0; z-index: 20;
    min-width: 240px; padding: var(--s2);
    background: var(--bg-1); border: var(--stroke) solid var(--line-strong);
    border-radius: var(--r-md); box-shadow: 0 4px 14px color-mix(in srgb, var(--fg-0) 16%, transparent);
    display: flex; flex-direction: column; gap: var(--s1);
  }
  .dt-new-item {
    display: block; width: 100%; text-align: left; padding: var(--s1) var(--s2);
    border: 0; background: transparent; color: var(--fg-0); border-radius: var(--r-sm);
    cursor: pointer; font-size: var(--text-xs); font-family: inherit;
  }
  .dt-new-item:hover { background: var(--bg-2); }
  .dt-new-sep { border-top: var(--stroke) solid var(--line); margin: var(--s1) 0; }
  .dt-new-label { color: var(--fg-2); font-size: var(--text-2xs); padding: 0 var(--s2); }
  .dt-new-row { display: flex; gap: var(--s1); }
  .dt-new-row .input { flex: 1; min-width: 0; }
  /* 根:主区 + 底部任务栏(恒在);吃满 body 余高(flex 链,不发明定高数)。
     注意 #dt-root 包装层同样要进 flex 链(缺它内层 min-height:0 全落空,
     2026-08-12 实测抓出:内容把整链顶穿) */
  #dt-root { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .dt-root { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  /* 分支一:桌面(壁纸 + 图标栅格;图标多时才滚) */
  .dt-desk {
    flex: 1; min-height: 0; overflow: auto; padding: var(--s4);
    background:
      radial-gradient(circle at 20% 20%, color-mix(in srgb, var(--live) 7%, transparent), transparent 60%),
      var(--bg-0);
  }
  .dt-icons { display: flex; gap: var(--s4); flex-wrap: wrap; }
  .dt-icon {
    display: flex; flex-direction: column; align-items: center; gap: var(--s1);
    width: 84px; padding: var(--s3) var(--s2); border: var(--stroke) solid transparent;
    border-radius: var(--r-md); background: transparent; color: var(--fg-1);
    cursor: pointer; position: relative; font-size: var(--text-2xs);
  }
  .dt-icon:hover { background: var(--bg-1); border-color: var(--line); }
  .dt-icon .dt-glyph {
    width: 40px; height: 40px; border-radius: var(--r-md);
    display: flex; align-items: center; justify-content: center;
    background: var(--bg-1); border: var(--stroke) solid var(--line);
    font-size: var(--text-lg); color: var(--fg-0);
  }
  /* 分支二:单窗(最大化 + 标题栏;内容区锁高藏溢出,面板各自滚) */
  .dt-win { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .dt-titlebar {
    flex: none;
    display: flex; align-items: center; gap: var(--s2);
    padding: var(--s1) var(--s3); border-bottom: var(--stroke) solid var(--line);
    background: var(--bg-1);
  }
  .dt-titlebar .dt-glyph {
    width: 20px; height: 20px; border-radius: var(--r-sm);
    display: flex; align-items: center; justify-content: center;
    background: var(--bg-0); border: var(--stroke) solid var(--line); font-size: var(--text-2xs);
  }
  .dt-title { font-weight: 500; }
  .dt-spacer { flex: 1; }
  .dt-btn {
    border: var(--stroke) solid var(--line); background: var(--bg-0); color: var(--fg-1);
    border-radius: var(--r-sm); cursor: pointer; padding: 0 var(--s2); font-size: var(--text-2xs);
  }
  .dt-btn:hover { border-color: var(--line-strong); }
  .dt-win-body { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; padding: var(--s3); }
  .dt-win-body > [data-slot] { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  /* 分支三:任务栏(恒在底部) */
  .dt-taskbar {
    flex: none;
    display: flex; align-items: stretch; gap: var(--s2);
    border-top: var(--stroke) solid var(--line); background: var(--bg-1);
    padding: var(--s1) var(--s2); min-height: 40px;
  }
  .dt-tasks { display: flex; gap: var(--s1); flex: 1; align-items: center; overflow-x: auto; }
  .dt-task {
    display: flex; align-items: center; gap: var(--s1);
    border: var(--stroke) solid var(--line); border-radius: var(--r-sm);
    padding: var(--s1) var(--s2); background: var(--bg-0); cursor: pointer;
    user-select: none; position: relative; font-size: var(--text-2xs); color: var(--fg-1);
  }
  .dt-task[data-active="1"] { border-color: var(--live); color: var(--fg-0); }
  .dt-task .dt-glyph {
    width: 18px; height: 18px; border-radius: var(--r-sm);
    display: flex; align-items: center; justify-content: center;
    background: var(--bg-1); border: var(--stroke) solid var(--line);
  }
  .dt-x {
    border: none; background: transparent; color: var(--fg-2); cursor: pointer;
    padding: 0 2px; border-radius: var(--r-sm); font-size: var(--text-2xs);
  }
  .dt-x:hover { color: var(--fg-0); }
  .dt-x.dt-arm { color: var(--sig-err, #d33); font-weight: 700; }
  /* badge 徽标(§4 补丁:闸门记账 → slotRefs.badge) */
  .dt-badge {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px;
    background: var(--live); color: var(--bg-0);
    font-size: var(--text-2xs); font-weight: 600; line-height: 1;
  }
  .dt-icon .dt-badge { position: absolute; top: 2px; right: 8px; }
  /* 托盘:inbox 系统件 */
  .dt-tray { display: flex; align-items: center; }
  .dt-tray-inbox { position: relative; display: flex; align-items: center; }
  .dt-tray-inbox > .dt-badge { position: absolute; top: -6px; right: -6px; }
  .w-inbox { display: flex; align-items: center; gap: var(--s1); padding: var(--s1) var(--s2); }
  .w-inbox-head { display: flex; align-items: center; gap: var(--s1); color: var(--fg-1); }
  .w-inbox-n { font-family: var(--font-mono); color: var(--fg-0); }
  .w-inbox-item, .w-inbox-more { display: none; } /* 托盘薄壳只显计数;清单面 C4.2+ */
  /* conversation 薄壳(C4.2):log 区 + composer(pf-* 复用 platform.css);
     吃满窗高:log flex:1 滚,composer 钉底;气泡宽度随窗(88%) */
  .cv-root { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .cv-log { flex: 1; min-height: 0; overflow: auto; padding: var(--s2); }
  .cv-log .pf-bubble { max-width: 88%; }
  .cv-composer {
    flex: none;
    display: flex; gap: var(--s2); align-items: flex-end;
    border-top: var(--stroke) solid var(--line); padding: var(--s2);
  }
  .cv-composer textarea { flex: 1; resize: vertical; }
  /* doc 活卡(§5 hard link):对话流 doc 卡下的 card 面活视图(同一 instance) */
  .cv-doc-live {
    margin-top: var(--s1); border-top: var(--stroke) dashed var(--line);
    max-height: 300px; overflow: auto; padding-top: var(--s1);
  }
  /* legacy 薄壳宿主(C4.3:skills/tools/lab/debug 原页面接进窗口)+ runs 自装 */
  .xp-legacy { flex: 1; min-height: 0; overflow: auto; }
  .xp-runs { flex: 1; min-height: 0; overflow: auto; }
  .pf-drop-ok { outline: 2px dashed var(--live); outline-offset: -2px; }
  .dt-events-wrap { flex: none; margin: 0 var(--s3) var(--s2); }
  .dt-events {
    border: var(--stroke) solid var(--line); border-radius: var(--r-sm);
    background: var(--bg-1); padding: var(--s1) var(--s2); min-height: 20px;
    font-family: var(--font-mono); font-size: var(--text-2xs); color: var(--fg-2); white-space: pre-wrap;
  }
</style>
</head>
<body data-route="desktop-widget">
  <div class="dt-top">
    <b>Agent OS</b>
    <div class="dt-new">
      <button class="btn btn-primary" id="dt-newbtn" aria-haspopup="menu" aria-expanded="false">+ 新建</button>
      <div class="dt-new-menu" id="dt-newMenu" role="menu" hidden>
        <button class="dt-new-item" id="dt-newconv" role="menuitem">新对话(新会话开窗)</button>
        <div class="dt-new-sep"></div>
        <span class="dt-new-label">开会话</span>
        <div class="dt-new-row">
          <select class="input" id="dt-sessions" aria-label="选择会话"></select>
          <button class="btn" id="dt-openconv">打开</button>
        </div>
        <div class="dt-new-sep"></div>
        <span class="dt-new-label">打开 app</span>
        <div class="dt-new-row">
          <select class="input" id="dt-kind" aria-label="选择 app">
            <option value="skills-explorer">技能</option>
            <option value="runs-explorer">运行</option>
            <option value="tools-explorer">工具</option>
            <option value="lab">Lab</option>
            <option value="debug-console">调试</option>
          </select>
          <button class="btn" id="dt-open">打开</button>
        </div>
      </div>
    </div>
    <span class="dt-build" id="dt-build"></span>
  </div>
  <div id="dt-root"></div>
  <div class="dt-events-wrap">
    <div class="dt-events" id="dt-events" role="log" aria-label="desktop 事件记录"></div>
  </div>
  <script type="module">
    import { bootDesktop } from "./static/desktop-page.js?v=2026-08-12.4";
    bootDesktop();
  </script>
</body>
</html>
