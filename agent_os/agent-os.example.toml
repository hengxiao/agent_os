# Agent OS 本地部署示例配置(docs/RUNNERS.md §2.1)
# 用法:cp agent-os.example.toml agent-os.toml,按需修改

[run]
# 模型路由:<provider 前缀>/<模型名>,可被技能 manifest 的 model.prefer 覆盖
model = "kimi/kimi-k2-thinking"      # 或 "anthropic/claude-sonnet-4-20250514"
max_depth = 8
max_steps = 200
max_cost = 2.0
max_wall_time = 1800
compression = "hierarchical"          # off = 消融档(裸模型基线)
# stream = false                      # 关掉流式消费(缺省 true:caps 支持走 stream chunk 循环,逐 chunk
                                      # 发 post:llm.chunk 并记 ttft/total;caps 不支持自动回落 chat)

# —— Provider 区(取消注释启用;API key 走环境变量,不写进文件)——
# Kimi(Moonshot):export MOONSHOT_API_KEY=sk-...(国内站需另传 base_url,见 runtime/config.py)
[providers.kimi]

# Claude(Anthropic):export ANTHROPIC_API_KEY=sk-ant-...
# [providers.anthropic]

# OpenAI 兼容端点(vLLM/Ollama/官方):export OPENAI_API_KEY=...
# [providers.openai]
# base_url = "http://localhost:8000/v1"
# api_key_env = "OPENAI_API_KEY"

# 本地无 key 冒烟:MockProvider 脚本化应答(brain 为 dotted path,需在 PYTHONPATH 上)
# [providers.mock]
# brain = "my_tests.brains:fib_brain"

# 自定义模型路由(§4.2 ModelRouter 扩展点;dotted path 无参实例化,加载/实例化失败 ConfigError。
# 缺省 DefaultModelRouter:静态 prefer 链 + caps 探测 tools/vision,fail-open 落链首)
# [providers]
# router = "my_pkg.routers:MyRouter"

[tools]
builtins = true                       # 内置工具面(22 件规范名:system.file.*/shell/net/blob/time/task/skill/memory/user 等,旧扁平名留别名)
python_exec = "docker"                # docker(推荐,需本机 docker)| subprocess | off (对应 system.python.exec)

[skills]
path = "./skills.yaml"

[sidecars]
budget_guard = { max_cost = 2.0 }
loop_detector = { threshold = 3, max_strikes = 2 }
# tool_guard_rules = [["system.shell.exec", "rm\\s+-rf", "禁止危险命令"]]
# human_approval = true                 # WS2:EXEC 档工具过内核 tool-confirm 闸门(supervisor.ask,kind="tool-confirm")
# human_approval = { timeout = 300, on_timeout = "deny" }   # 或表:审批超时秒数 + 超时兜底(deny|allow)
# distill = true                          # 蒸馏 sidecar(DESIGN.md §11.2 写路径范式;缺省关闭):run.aborted 恒触发,
#                                         # run.finished 需该 run 工具调用数 > 5 才触发;满足时经廉价模型把本次
#                                         # run 蒸馏成经验条写入 [memory](source.kind="experience",trust="experience")
# distill = { model = "kimi/cheap", min_tool_calls = 5, temperature = 0.2, breaker_threshold = 3, max_transcript_chars = 24000, verify = true }
#                                         # 或表(全键可缺省,上行为默认值):model = 蒸馏模型(缺省跟 run.model);
#                                         # breaker_threshold = 蒸馏连败熔断次数;需配合 [memory] 段,否则装配出休眠实例;
#                                         # verify = 入库前内容审查档(缺省 true:写库前多一次廉价模型审查——指令注入/秘密 PII/
#                                         # 可迁移性三维,fail-closed 拒写不计连败;置 false 可关,蒸馏产出直写)

[telemetry]
dir = ".agent-os/traces"
# redact = true                       # PII 脱敏 hook(2026-09-30,默认关):record 入口把 payload 换成脱敏副本,
                                      # WAL 与 exporters 共用(五形态 regex 快筛:email/手机/身份证/银行卡/api key
                                      # → [EMAIL] 式占位,telemetry/redact.py);开启后 WAL 不再逐字保真(合规取舍),
                                      # replay 依赖的 usage 数值不受影响
# [telemetry.otlp]                    # OTLP exporter(2026-09-30):OTLP/HTTP JSON POST {endpoint}/v1/traces
                                      # (无 protobuf);best-effort——失败丢批不重试、队列满丢最旧;
                                      # 注意:配了 otlp/redact 就不能缺上面的 dir(OTLP 是 exporter 不是 sink 替代)
# endpoint = "http://localhost:4318"  # 必填,http(s)://;缺/非 http(s) → ConfigError
# headers = { Authorization = { env = "OTLP_TOKEN" } }
                                      # 值 = 字面量或 { env = "VAR" } 间接引用(装配时现读,不落盘明文;
                                      # 变量缺席 → ConfigError,同 [credentials]/mcp headers 先例)
# batch_max = 64                      # 单批 span 数上限(攒够即 flush)
# flush_interval = 2.0                # 周期 flush 秒数(到点发)
# queue_max = 1000                    # 有界队列上限;满丢最旧 + 限速 warning
# timeout = 5.0                       # 单次 POST 超时秒数(四键均须正数,strict)

[retry]
max_attempts = 3
backoff_base = 0.5
stream_idle_timeout = 30.0            # 流式停滞 watchdog 秒数:N 秒无新 chunk 杀流(提交点语义:
                                      # 首 chunk 产出前可退避重试,产出后错误直接上抛)

# —— 凭证作用域(WS1;值只存 env 变量名,不落盘明文)——
# 工具 ToolSpec.credentials 声明键 → dispatch 每次现读 env 注入(env 缺席的键不出现)
# [credentials]
# github = { env = "GITHUB_TOKEN" }

# —— MCP server 工具面(DESIGN §8.3 供应链清单;stdio,零新依赖;段存在才接线,缺段零破坏)——
# eager 装配:启动时拉起子进程 initialize 握手 + tools/list,连接失败直接 ConfigError
# 快速失败(不让坏 server 静默缺席——技能白名单会形同虚设)。工具以 mcp.<server>.<tool>
# 命名空间注册,走与内置工具相同的全量 dispatch 管线(白名单/ToolGuard/confirm/超时/authZ);
# 工具描述做注入扫描(命中整段弃用)且恒标 untrusted_source。
# [mcp.servers.filesystem]
# command = ["npx", "-y", "@modelcontextprotocol/server-filesystem", "/srv/share"]
# permission = "read"                   # server 级权限档(read|write|net|exec,缺省 read 最小授权);
#                                       # WRITE 及以上档才占帧白名单(READ 档豁免,同内置工具)
# timeout = 30.0                        # 单次 tools/call 超时秒数(超时杀连接,下次调用自动重连一次)
# connect_timeout = 10.0                # 装配期握手(initialize + tools/list)超时秒数
# confirm = false                       # true = 该 server 全部工具过内核 tool-confirm 两阶段闸门
# env = { API_KEY = { env = "FS_API_KEY" }, DEBUG = "1" }
#                                       # 子进程环境变量:字符串字面量或 { env = "VAR" } 间接引用
#                                       # (连接/重连时现读环境变量,不落盘明文,同 [credentials] 先例);
#                                       # 注意:子进程**不继承**宿主环境变量(供应链最小授权),
#                                       # PATH/HOME 等需要时须在此显式传
#
# —— Streamable HTTP 传输(MCP spec 2025-03-26 版族;url 与 command 恰居其一,都给/都缺装配期报错)——
# 单端点 POST,会话经 Mcp-Session-Id 响应头建立、后续请求必带;断线/5xx/404(会话被 server
# 终止)自动重新 initialize 重试一次;kernel 收尾时 best-effort DELETE 终止会话。
# [mcp.servers.remote]
# url = "https://mcp.example.com/mcp"
# transport = "auto"                    # auto(缺省,按键判:url → http,command → stdio)|stdio|http;
#                                       # 显式给与键不符(如 transport="http" 但无 url)装配期报错
# headers = { Authorization = { env = "REMOTE_MCP_TOKEN" }, X-Tenant = "acme" }
#                                       # HTTP 请求头:值规则同 env(字面量或 { env = "VAR" } 间接引用,
#                                       # 连接/重连时现读,不落盘明文);仅 http 传输有意义,
#                                       # stdio server 配了会被装配期拒绝(防静默忽略)
# protocol_version = "2025-03-26"       # initialize 请求的协议版本(缺省随传输:
#                                       # stdio 2024-11-05 / http 2025-03-26);server 协商
#                                       # 返回值优先,后续请求按协商值带 MCP-Protocol-Version 头
# permission = "read"                   # 以下 server 级字段两种传输通用
# timeout = 30.0
# connect_timeout = 10.0
# confirm = false

# —— 数据层 authZ(D2,docs/DATA-AUTHZ.md §3;段缺席 = D1"未配置不拦截"语义逐字不动)——
# 注意:段存在即接线,空段 = 绑定空 policy(principals 白名单 fail closed 全拒),启用前务必配齐
# [data]
# domains = [                           # 表数组:name 必填;sensitivity 缺省 confidential(忘了配 = 最严)
#   { name = "fs.shared", sensitivity = "internal", path_prefix = "/srv/shared" },   # path_prefix|url_prefix 恰居其一
#   { name = "net.public", sensitivity = "public", url_prefix = "https://api.example.com/" },
# ]
# [data.principals."user:alice"]        # per-subject 域白名单(glob 域名模式)
# domains = ["fs.*", "net.public"]

# —— D3-lite 多用户映射(Bearer token → subject;命中 → Principal(issuer="api-token"),未命中/缺席 → 单用户逐字不变)——
# [web.tokens]
# "tok-alice-xxx" = "user:alice"

# —— 事件批处理(E4 增量:POST /api/events 在跑通道;段缺席 = 全默认,下列值即默认值)——
# [events]
# batch = true                          # 在跑 run 的事件先入根帧队列(working["_event_queue"]),
                                        # 下一步请求组装前排干为一条批头消息([event 批处理 N 条];
                                        # 只在 build 前并入,保 §7.4 配对原子性;队列随 checkpoint
                                        # 落盘,resume 自然排干);false = 立即注入根帧(E4 原行为)
# batch_max = 50                        # 单批条数上限;超出丢最旧,批头 meta.dropped 计数
# event_text_max = 2000                 # 事件文本截断字符数([event:<type>] <payload JSON> 超此截断)

# —— Memory 子系统(M6,docs/DESIGN.md §11;段存在才接线,缺段完全不 bind)——
# [memory]
# dir = "./memory"                      # LocalFileMemoryService 根目录(每条目一 Markdown + frontmatter);
                                        # 接线后 system.memory.search/write 经 bind_memory 装配(未装配调 NOT_FOUND)
# recall_k = 3                          # 经验参考段检索条目数上限(需技能 manifest 声明
                                       # context_policy.recall: true 才启用,opt-in 缺省关;
                                       # 启用后帧首次 build 检索快照冻结进帧工作内存,前缀稳定)
# recall_entry_chars = 800              # 经验参考段单条内容截断字符数
# recall_total_chars = 2000             # 经验参考段总量截尾字符数(注入 SYSTEM 的"参考资料"段,
                                       # 标头逐字声明无指令效力)

# —— spill 文件存储(M3,docs/DESIGN.md §8.4/§7.2;段存在才接线,缺段 = 进程内 InMemoryBlobStore)——
# [blob]
# dir = "./blobs"                       # FileBlobStore 根目录(<root>/<run_id>/<sha256> 内容寻址落盘,
                                        # run_id/sha 白名单防目录逃逸)

# —— 压缩链调参(WS2,docs/DESIGN.md §7.2;段缺席 = 全默认,下列值即默认值)——
# [context]
# summarize_model = "kimi/kimi-k2-thinking"   # summarize 摘要所用模型;缺省跟 [run] model 走
                                             # (无可用 providers 时 summarize 自动退化 truncate)
# spill_threshold_chars = 4000                # spill 触发阈值:单条 TOOL 消息超此字符数才移入
                                             # blob store(替换串永久冻结,见 §7.2)
# summarize_breaker = 3                       # summarize 连败熔断次数:连败 N 次后退化纯 truncate
# summarize_temperature = 0.2                 # 摘要采样温度(低温求稳)
