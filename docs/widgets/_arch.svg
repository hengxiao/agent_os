<svg xmlns='http://www.w3.org/2000/svg' width='380' height='240' viewBox='0 0 380 240'><rect x='1' y='1' width='378' height='238' rx='10' fill='#f6f7f9' stroke='#b9bec9'/><rect x='1' y='1' width='378' height='26' rx='10' fill='#eceef2' stroke='#b9bec9'/><text x='12' y='18' font-size='11' fill='#4a4a52' font-family='sans-serif' font-weight='bold'>Widget 基座:渲染与逻辑分离</text><rect x='16' y='40' width='160' height='60' rx='6' fill='#e8f0fe' stroke='#b9bec9' stroke-width='1.2' /><text x='24' y='56' font-size='10' fill='#4a4a52' font-family='sans-serif' font-weight='bold'>w-text.js(逻辑)</text><text x='24' y='70' font-size='9' fill='#4a4a52' font-family='sans-serif' >状态机 / 行为 / emit</text><rect x='204' y='40' width='160' height='60' rx='6' fill='#e6f6ec' stroke='#b9bec9' stroke-width='1.2' /><text x='212' y='56' font-size='10' fill='#4a4a52' font-family='sans-serif' font-weight='bold'>w-text.render.js</text><text x='212' y='70' font-size='9' fill='#4a4a52' font-family='sans-serif' >render(state)→html</text><text x='24' y='82' font-size='8' fill='#8a8f99' font-family='sans-serif' >不碰 DOM / 不拼 HTML</text><text x='212' y='82' font-size='8' fill='#8a8f99' font-family='sans-serif' >无副作用 / 不写 state</text><line x1='176' y1='70' x2='204' y2='70' stroke='#3b82f6' stroke-width='1' /><text x='180' y='66' font-size='8' fill='#3b82f6' font-family='sans-serif' >state</text><rect x='16' y='116' width='348' height='40' rx='6' fill='#fff' stroke='#b9bec9' stroke-width='1.2' /><text x='24' y='132' font-size='10' fill='#4a4a52' font-family='sans-serif' >widget.js 工厂(state 可序列化/事件上行/寻址)</text><rect x='16' y='164' width='348' height='40' rx='6' fill='#fff' stroke='#b9bec9' stroke-width='1.2' /><text x='24' y='180' font-size='10' fill='#4a4a52' font-family='sans-serif' >css/widgets.css(全 token)+ 六主题 copy</text><text x='16' y='224' font-size='8' fill='#8a8f99' font-family='sans-serif' >宿主只给容器 + 订阅事件;出海只有 events → app action</text></svg>