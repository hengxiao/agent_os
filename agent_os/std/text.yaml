    '
- name: common.text.compress_context
  version: 1.0.0
  kind: prompt
  description: '任务感知压缩。Use when 长上下文要围绕当前任务压缩且必须保住指定要点,如 query=''预算是多少'' + preserve=[''预算
    $2''] → compressed 逐字含全部 preserve 项; Do not use when 需要任务无关摘要(用 summarize,两者不可互替)或没有
    query 的 泛压缩。返回 {"compressed": 压缩结果, "dropped_estimate": 估计丢弃字符数}。'
  inputs:
    type: object
    properties:
      text:
        type: string
        description: 待压缩上下文
      query:
        type: string
        description: 当前任务/查询
      preserve:
        type: array
        items:
          type: string
        description: 必须逐字保留的要点(一项都不能少)
    required:
    - text
    - query
    - preserve
  outputs:
    type: object
    properties:
      compressed:
        type: string
        description: 压缩结果(逐字含全部 preserve 项)
      dropped_estimate:
        type: integer
        description: 估计丢弃的字符数
    required:
    - compressed
    - dropped_estimate
  permissions: {}
  prompt: '你是任务感知压缩器。输入 JSON 在第一条用户消息:字段 text 为待压缩上下文,query 为当前任务,preserve 为必须逐字保留的要点数组。

    围绕 query 压缩 text:与任务无关的内容坚决丢弃;preserve 中每一项都必须逐字出现在结果里,一个都不能少。

    只输出最终答案 JSON:字符串字段 compressed(压缩结果,含全部 preserve 项)与整数字段 dropped_estimate(估计丢弃的字符数)。

    '
